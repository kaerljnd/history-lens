<script>
const QUESTIONS = [
  {
    "id": 1,
    "title": "开放港口还是维护自主",
    "theme": "开放与主权",
    "scenario": "某地区长期与外部进行有限贸易。一个技术和军事力量更强的外部集团，希望当地扩大贸易、开放更多港口，并允许其商人在当地经营。支持者强调技术、商品与收入，反对者担心弱势地位可能带来依赖。",
    "ask": "如果由你负责谈判，你会如何决定开放的范围？",
    "new": "对方进一步要求：其人员发生法律纠纷时部分不受当地法院管辖；当地调整进口税率的权利也受到条约限制。",
    "follow": "知道这些条件后，你会维持、调整还是改变决定？需要增加什么保障？",
    "history": "日本幕末开港与1858年安政五国条约。日本扩大通商，但条约含片面的领事裁判权、关税限制等不平等条件。开放贸易和维护自主并不是同一维度的问题。",
    "sources": [
      {
        "name": "日本外务省：幕末条约问答",
        "url": "https://www.mofa.go.jp/mofaj/annai/honsho/shiryo/qa/bakumatsu_01.html"

      {
        "name": "日本税关：关税史",
        "url": "https://www.customs.go.jp/english/zeikan/history_e.htm"

    "options": {
      "tradeoff": [
        {
          "text": "只看外部力量是否先进",
          "points": 0
        },
        {
          "text": "主要看能带来多少贸易收入",
          "points": 1
        },
        {
          "text": "一起评估交易收益、谈判筹码和长期自主空间",
          "points": 2
        }
      ],
      "evidence": [
        {
          "text": "外部集团对开放的积极表态",
          "points": 0
        },
        {
          "text": "开放后某个商人赚了多少钱",
          "points": 1
        },
        {
          "text": "条约文本、贸易测算及争端解决机制的实际约束",
          "points": 2
        }

      "stakeholders": [
        {
          "text": "只考虑本地管理层的声望",

        },
        {
          "text": "兼顾商人和政府财政",
          "points": 1
        },
        {
          "text": "同时衡量商人、劳动者、居民及未来政策空间",
          "points": 2
        }
      ],
      "revision": [
        {
          "text": "既然出现新条件，就完全按原来的立场执行",
          "points": 0
        },
        {
          "text": "判断条约不利就立刻断绝所有往来",

    "ask": "你是否愿意批准扶持计划？会设哪些条件？",
    "new": "若干年后，一部分受扶持企业出口表现出色；另一部分长期依赖优惠，甚至出现投资浪费和关系输送。",
    "follow": "你会保留、取消或修改扶持计划？如何区别不同企业？",

    "sources": [

        "name": "世界银行：韩国工业政策回顾（PDF）",

        },

          "text": "如果企业能赚钱就值得继续给优惠",

        },
        {
          "text": "明确扶持目标、退出期限、绩效条件和公共成本",
          "points": 2

        },

        }

          "points": 2
        }

      "revision": [

          "text": "只要有失败案例就立刻取消一切支持",

  {

        },

function historyPanel(q,a){const complete=isComplete(a);return `<article class="histcase"><div class="flexbetween"><span class="pill">第${q.id}题 · ${esc(q.theme)}</span><span class="small">${complete?'已答':'跳过'}</span></div><h3>${esc(q.title)} — 历史揭晓</h3><p>${esc(q.history)}</p><p class="small"><b>历史阅读提醒：</b>${esc(q.note)}</p><p class="source">${q.sources.map((src,i)=>`<a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">史料 ${i+1}：${esc(src.name)} ↗</a>`).join('')}</p>${complete?`<details><summary>展开查看自己的回答</summary><p class="small">初步判断：${esc(STANCES[a.stance])}；新信息后的判断：${esc(CHANGES[a.change])}</p>${a.reasonText?`<div class="reportquote">${esc(a.reasonText)}</div>`:''}${a.revisionText?`<div class="reportquote">${esc(a.revisionText)}</div>`:''}</details>`:''}</article>`}
function exportJSON(){let blob=new Blob([JSON.stringify({type:'history-lens-exercise',version:'1.0',exportedAt:new Date().toISOString(),notice:'结构化选择不等于心理或政治倾向诊断',questions:s.selected.map(id=>{let q=QUESTIONS.find(q=>q.id===id);return {id,title:q.title,theme:q.theme,history:q.history,answer:s.answers[id]||null}}),summary:calc()},null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob);let el=document.createElement('a');el.href=url;el.download='历史透镜-答题记录-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('内容已复制。')}catch(e){let x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.left='-999px';document.body.appendChild(x);x.select();let ok=document.execCommand('copy');x.remove();alert(ok?'内容已复制。':'复制失败，请手动选择页面内容。')}}
$('fontBtn').onclick=()=>{s.large=!s.large;save();document.body.classList.toggle('large',s.large);$('fontBtn').textContent=s.large?'标准字号':'大字阅读'};
$('homeBtn').onclick=()=>{s.mode='intro';save();render()};
render();
</script>
</body></html>
